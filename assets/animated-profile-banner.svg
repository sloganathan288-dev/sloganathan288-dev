<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Loganathan — AI and Full Stack Developer</title>
<desc id="desc">Animated dark navy and electric blue developer banner with a profile avatar, orbiting nodes, code motifs and a glowing title.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#102a43"/><stop offset="1" stop-color="#07111f"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#2563eb" stop-opacity=".32"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  <clipPath id="avatar"><circle cx="160" cy="165" r="86"/></clipPath>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="330" rx="26" fill="url(#bg)"/>
<circle cx="160" cy="165" r="130" fill="url(#halo)" filter="url(#blur)"/>
<path d="M0 270 Q280 190 520 260 T1200 205" fill="none" stroke="#2563eb" stroke-opacity=".18" stroke-width="2"/>
<g fill="none" stroke="url(#glow)" stroke-opacity=".45">
 <circle cx="160" cy="165" r="100" stroke-width="2" stroke-dasharray="8 12"><animateTransform attributeName="transform" type="rotate" from="0 160 165" to="360 160 165" dur="24s" repeatCount="indefinite"/></circle>
 <circle cx="160" cy="165" r="116" stroke-width="1" stroke-dasharray="2 10"><animateTransform attributeName="transform" type="rotate" from="360 160 165" to="0 160 165" dur="32s" repeatCount="indefinite"/></circle>
</g>
<circle cx="160" cy="165" r="88" fill="#0b1626" stroke="url(#glow)" stroke-width="4"/>
<g clip-path="url(#avatar)">
 <image href="https://avatars.githubusercontent.com/u/224912046?v=4" x="72" y="77" width="176" height="176" preserveAspectRatio="xMidYMid slice"/>
</g>
<circle cx="160" cy="165" r="91" fill="none" stroke="#7dd3fc" stroke-opacity=".55" stroke-width="1.5"/>
<g font-family="Segoe UI,Arial,sans-serif">
 <text x="315" y="106" fill="#7dd3fc" font-size="16" letter-spacing="5">AI  •  AUTOMATION  •  FULL STACK</text>
 <text x="310" y="170" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="1">LOGANATHAN</text>
 <rect x="312" y="192" width="520" height="3" rx="2" fill="url(#glow)"><animate attributeName="width" values="80;520;420;520" dur="7s" repeatCount="indefinite"/></rect>
 <text x="315" y="235" fill="#cbd5e1" font-size="22">Building useful solutions with code, AI and automation</text>
 <text x="315" y="277" fill="#67e8f9" font-size="15" letter-spacing="2">JAVA  /  PYTHON  /  REACT  /  SQL  /  n8n  /  SUPABASE</text>
 <text x="1080" y="292" fill="#64748b" font-size="12" text-anchor="end">LEARN • BUILD • ADAPT</text>
</g>
<g fill="#67e8f9">
 <circle cx="1020" cy="75" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="1090" cy="130" r="3"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="970" cy="250" r="5"><animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite"/></circle>
 <circle cx="1140" cy="220" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<g fill="#93c5fd" font-family="monospace" font-size="18" opacity=".5">
 <text x="940" y="65">{ }</text><text x="1080" y="185">&lt;/&gt;</text><text x="900" y="295">0101</text>
</g>
</svg>