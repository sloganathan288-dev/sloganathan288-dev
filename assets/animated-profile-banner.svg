<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">LOGANATHAN — AI, Automation and Full Stack Developer</title>
<desc id="desc">A cinematic animated developer banner with a centered profile portrait, glowing orbital rings, moving particles and a futuristic blue violet interface.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset=".48" stop-color="#10233d"/><stop offset="1" stop-color="#080d1c"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#2563eb" stop-opacity=".4"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="portrait"><circle cx="600" cy="178" r="83"/></clipPath>
</defs>
<rect width="1200" height="440" rx="28" fill="url(#bg)"/>
<circle cx="600" cy="178" r="170" fill="url(#aura)"/>
<path d="M0 350 C190 260 320 410 500 330 S850 250 1200 340" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="2"/>
<path d="M0 375 C220 290 350 430 560 350 S920 300 1200 370" fill="none" stroke="#a78bfa" stroke-opacity=".13" stroke-width="1"/>
<g transform="translate(600 178)" fill="none" stroke="url(#neon)" filter="url(#glow)">
 <circle r="105" stroke-width="2.5" stroke-dasharray="16 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
 <circle r="123" stroke-width="1.5" stroke-dasharray="3 10" opacity=".8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="27s" repeatCount="indefinite"/></circle>
 <ellipse rx="148" ry="58" stroke-width="1.2" opacity=".55" transform="rotate(-24)"><animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/></ellipse>
</g>
<circle cx="600" cy="178" r="88" fill="#081426" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>
<g clip-path="url(#portrait)">
 <image href="https://avatars.githubusercontent.com/u/224912046?v=4&amp;size=460" x="517" y="95" width="166" height="166" preserveAspectRatio="xMidYMid slice"/>
 <rect x="517" y="95" width="166" height="166" fill="none" stroke="#fff" stroke-opacity=".08"/>
</g>
<circle cx="600" cy="178" r="91" fill="none" stroke="#e0f2fe" stroke-opacity=".8" stroke-width="1.5"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
 <text x="600" y="40" fill="#7dd3fc" font-size="15" letter-spacing="6">AI  •  AUTOMATION  •  FULL STACK</text>
 <text x="600" y="320" fill="#f8fafc" font-size="55" font-weight="800" letter-spacing="2">LOGANATHAN</text>
 <text x="600" y="355" fill="#cbd5e1" font-size="20">Building useful solutions with code, AI &amp; automation</text>
 <text x="600" y="395" fill="#67e8f9" font-size="15" letter-spacing="3">JAVA  /  PYTHON  /  REACT  /  SQL  /  n8n  /  SUPABASE</text>
</g>
<rect x="340" y="332" width="520" height="2" rx="1" fill="url(#neon)" opacity=".8"><animate attributeName="width" values="80;520;160;520" dur="6s" repeatCount="indefinite"/></rect>
<g fill="#67e8f9">
 <circle cx="180" cy="105" r="4"><animate attributeName="cy" values="105;70;105" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="1020" cy="130" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="2.6s" repeatCount="indefinite"/></circle>
 <circle cx="930" cy="260" r="5"><animate attributeName="r" values="2;6;2" dur="3.2s" repeatCount="indefinite"/></circle>
 <circle cx="260" cy="290" r="3"><animate attributeName="opacity" values="1;.1;1" dur="2.3s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="330" r="4"><animate attributeName="cy" values="330;300;330" dur="4s" repeatCount="indefinite"/></circle>
</g>
<g fill="#93c5fd" opacity=".5" font-family="monospace" font-size="22">
 <text x="115" y="205">&lt;/&gt;</text><text x="1000" y="85">{ }</text><text x="100" y="350">0101</text><text x="1050" y="225">AI()</text>
</g>
</svg>